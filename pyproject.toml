[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-server"
version = "0.2.0"
description = "Clara: one AI with one memory, served over HTTP to any number of clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ollama>=0.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "tzdata; sys_platform == 'win32'",  # Windows has no timezone database of its own
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
clara-server = "clara.server:main"
clara-chat = "clara.client:main"
clara-admin = "clara.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
